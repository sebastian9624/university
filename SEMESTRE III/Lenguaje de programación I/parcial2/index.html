<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
    body{
        margin: 30px;
        text-align: center;
        font-family: 'Poppins', sans-serif;
        color: white;
        margin: 0;
    }

    .container{
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100vw;
        height: 100vh;
        
    }

    .background{
        background: linear-gradient(to bottom right,#002f4b,#dc4225);
        opacity: .6;
        width: 100vw;
        height: 100vh;

    }
    </style>
</head>
<body>
    <div class="container">
        <div class="background">

                <div width="50%">
                <label for="equipos">Equipo</label>
                <select name="" id="equipo">
                    <option value="Real Madrid">Real Madrid</option>
                    <option value="Barcelona">Barcelona</option>
                    <option value="Atlético Madrid">Atlético Madrid</option>
                    <option value="Once Caldas">Once Caldas</option>
                    <option value="Nacional">Nacional</option>
                    <option value="América">América</option>
                </select>
            </div>
        
            <br>
        
            <div width="50%">
                <label for="ganados">Partidos ganados</label>
                <input type="number" id="ganados">
            </div>
        
            <br>
        
            <div width="50%">
                <label for="perdidos">Partidos perdidos</label>
                <input type="number" id="perdidos">
            </div>
        
            <br>
        
            <div width="50%">
                <label for="empatados">Partidos empatados</label>
                <input type="number" id="empatados">
            </div>
        
            <br>
        
            <div width="50%">
                <button type="button" id="btn-analizar">Analizar resultados</button>
            </div>
        
            <br><br><br>
            <div id="resultados"></div>
        
        
            </div>
        </div>
    
    <script src="./js/app.js"></script>
</body>
</html>
